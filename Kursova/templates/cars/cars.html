{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<h2>Список автомобілів</h2>
<table>
    <tr><th>ID</th><th>Марка</th><th>Модель</th><th>Рік</th><th>VIN</th><th>Технічний стан</th></tr>
    {% for car in cars %}
    <tr>
        <td>{{ car.id }}</td>
        <td>{{ car.brand }}</td>
        <td>{{ car.model }}</td>
        <td>{{ car.year }}</td>
        <td>{{ car.vin }}</td>
        <td>{{ car.technical_state }}</td>
    </tr>
    {% endfor %}
</table>
<a href="/cars/add" class="adding_rel">Додати авто</a>
{% endblock %}
