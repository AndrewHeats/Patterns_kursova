{% extends "base.html" %}
{% block content %}
<h2>Редагувати витрати на паливо</h2>
<form method="post" action="/fuelcosts/edit/{{ fuel.id }}">
    Дата: <input type="date" name="date" value="{{ fuel.date }}" required><br>
    Тип: <input type="text" name="type" value="{{ fuel.type }}" required><br>
    Вартість: <input type="number" name="cost" value="{{ fuel.cost }}" required min="0"><br>
    Машина: <select name="car_id">
        {% for car in cars %}
        <option value="{{ car.id }}" {% if fuel.car_id == car.id %}selected{% endif %}>{{ car.brand }} {{ car.model }}</option>
        {% endfor %}
    </select><br>
    <input type="submit" value="Зберегти">
</form>
{% endblock %}
