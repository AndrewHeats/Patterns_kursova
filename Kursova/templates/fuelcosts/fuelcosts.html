{% extends "base.html" %}
{% block content %}
<h2>Витрати на паливо</h2>
<table>
    <tr><th>ID</th><th>Дата</th><th>Тип</th><th>Вартість</th><th>Машина</th></tr>
    {% for fuel in fuelcosts %}
    <tr>
        <td>{{ fuel.id }}</td>
        <td>{{ fuel.date }}</td>
        <td>{{ fuel.type }}</td>
        <td>{{ fuel.cost }}</td>
        <td>{{ fuel.car_id }}</td>
    </tr>
    {% endfor %}
</table>
<a href="/fuelcosts/add">Додати запис</a>
{% endblock %}
