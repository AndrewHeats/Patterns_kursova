{% extends "base.html" %}
{% block content %}
<h2>Редагувати поїздку</h2>
<form method="post" action="/trips/edit/{{ trip.id }}">
    Дата: <input type="date" name="date" value="{{ trip.date }}" required><br>
    Маршрут: <input type="text" name="route" value="{{ trip.route }}" required><br>
    Відстань: <input type="number" name="distance" value="{{ trip.distance }}" required min="0"><br>
    Авто: <select name="car_id">
        {% for car in cars %}
        <option value="{{ car.id }}" {% if trip.car_id == car.id %}selected{% endif %}>{{ car.brand }} {{ car.model }}</option>
        {% endfor %}
    </select><br>
    Водій: <select name="driver_id">
        {% for driver in drivers %}
        <option value="{{ driver.id }}" {% if trip.driver_id == driver.id %}selected{% endif %}>{{ driver.name }}</option>
        {% endfor %}
    </select><br>
    <input type="submit" value="Зберегти">
</form>
{% endblock %}
